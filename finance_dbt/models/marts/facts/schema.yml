version: 2

models:
  - name: fact_daily_prices
    description: "Star Schema core fact table: Daily prices, returns, Bollinger Bands, RSI 14, and MACD"
    tests:
      - high_gte_low:
          high_column: high_price
          low_column: low_price
    columns:
      - name: price_fact_id
        description: "Primary key: MD5(symbol, trade_date)"
        tests:
          - unique
          - not_null

      - name: security_id
        description: "Foreign key to dim_security"
        tests:
          - not_null
          - relationships:
              to: ref('dim_security')
              field: security_id

      - name: date_id
        description: "Foreign key to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: close_price
        description: "Official unadjusted close in INR"
        tests:
          - not_null
          - price_positive

      - name: high_price
        description: "Intraday high"
        tests:
          - not_null
          - price_positive

      - name: low_price
        description: "Intraday low"
        tests:
          - not_null
          - price_positive

      - name: rsi_14
        description: "14-session Relative Strength Index bound between 0 and 100"
        tests:
          - rsi_bounds

  - name: fact_macro_indicators
    description: "Star Schema macro fact table: Official RBI repo rate, MOSPI CPI, and FX series"
    columns:
      - name: macro_fact_id
        description: "Primary key"
        tests:
          - unique
          - not_null

      - name: date_id
        description: "Foreign key to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: indicator_value
        description: "Recorded metric value"
        tests:
          - not_null

  - name: fact_mf_nav
    description: "Daily Mutual Fund NAV observations with return and 52W high/low metrics"
    columns:
      - name: nav_fact_id
        tests:
          - unique
          - not_null
      - name: fund_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_fund')
              field: fund_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: nav
        tests:
          - not_null
          - price_positive
